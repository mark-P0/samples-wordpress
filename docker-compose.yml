services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      CODESPACES: "${CODESPACES:-false}"
      CODESPACE_NAME: "${CODESPACE_NAME:-}"
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: "${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}"
      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
            $$_SERVER['HTTPS'] = 'on';
        }
        if (getenv('CODESPACES') === 'true') {
            $$codespaces_host = getenv('CODESPACE_NAME') . '-8080.' . getenv('GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN');
            define('WP_HOME', 'https://' . $$codespaces_host);
            define('WP_SITEURL', 'https://' . $$codespaces_host);
            $$_SERVER['HTTPS'] = 'on';
            $$_SERVER['HTTP_HOST'] = $$codespaces_host;
            $$_SERVER['SERVER_PORT'] = 443;
        }
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/maison-elan:/var/www/html/wp-content/themes/maison-elan
      - ./wp-content/plugins/maison-elan-content:/var/www/html/wp-content/plugins/maison-elan-content

volumes:
  db_data:
  wordpress_data:
